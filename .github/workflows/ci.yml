name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate manifest and palettes
        run: node test/validate.js
      - name: Syntax-check extension scripts
        run: for f in extension/src/*.js extension/src/popup/*.js; do node --check "$f"; done
      - name: Build store packages
        run: ./build.sh
      - name: Lint Firefox package
        run: |
          mkdir -p "$RUNNER_TEMP/ff"
          unzip -q dist/dmg-mode-firefox-*.zip -d "$RUNNER_TEMP/ff"
          npx --yes web-ext@8.10.0 lint --source-dir "$RUNNER_TEMP/ff" --warnings-as-errors

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build store package
        run: ./build.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
